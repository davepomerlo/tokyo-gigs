name: Sample source pages

# Developer tool: saves one copy of each page in tools/sample_urls.txt to the
# 'samples' branch, so new scrapers can be written and tested against real HTML.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch pages
        run: python tools/sample_pages.py tools/sample_urls.txt /tmp/samples
      - name: Save to the samples branch
        run: |
          git config user.name "gig-scan bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan samples
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/samples ./samples
          git add samples
          git commit -qm "Source page samples $(date -u +%F)"
          git push -f origin samples
