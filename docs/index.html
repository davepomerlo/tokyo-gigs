<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gigs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tokyo Gigs</title>
<meta name="description" content="Live music in Tokyo from Tokyo Gig Guide, Tokyo Dross, Songkick and more - one list, filterable by day, genre and price.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Tokyo Gigs</h1>
      <p id="updated">Loading listings…</p>
    </div>
    <div class="head-btns">
      <button class="theme-btn install-btn" id="installBtn" type="button" hidden>Install app</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme">Theme</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="days" id="days" aria-label="Pick a day"></nav>
</div>

<div class="filters">
  <div class="wrap">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search artist, venue or area" aria-label="Search artist, venue or area">
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="When">
        <button type="button" data-range="tonight">Tonight</button>
        <button type="button" data-range="weekend">Weekend</button>
        <button type="button" data-range="week">7 days</button>
        <button type="button" data-range="all">All</button>
      </div>
      <button class="more-btn" id="moreBtn" type="button" aria-expanded="false" aria-controls="extra">Filters</button>
    </div>
    <div class="extra" id="extra">
      <label>Up to <input type="range" id="price" min="1000" max="15000" step="500" value="15000" aria-label="Maximum price"> <span class="price-out" id="priceOut">any price</span></label>
      <label>Area <select id="area"><option value="">All areas</option></select></label>
      <label><input type="checkbox" id="free"> Free only</label>
      <label><input type="checkbox" id="saved"> Saved only</label>
    </div>
    <div class="genres" id="genres" role="group" aria-label="Genres"></div>
    <div class="summary"><span id="count"></span><button type="button" id="reset">Clear filters</button></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<footer class="wrap" id="foot"></footer>

<script src="app.js"></script>
</body>
</html>
